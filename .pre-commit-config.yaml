repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: ["--maxkb=1024"]
    - id: check-toml
    - id: check-yaml
      args: [ --unsafe ]
    - id: end-of-file-fixer
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.1
  hooks:
    - id: ruff-format
- repo: local
  hooks:
    - id: unit-tests
      name: unit tests (dev env)
      entry: sh script/run_test.sh --env dev --test unit
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
    - id: api-tests
      name: api tests (dev env)
      entry: sh script/run_test.sh --env dev --test api
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
    - id: e2e-tests
      name: e2e tests (dev env)
      entry: sh script/run_test.sh --env dev --test e2e
      language: system
      pass_filenames: false
      always_run: true
      stages: [pre-push]
