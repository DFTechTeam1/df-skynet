[project]
name = "df-skynet"
version = "0.1.0"
description = "SaaS backend for AI image/video generation via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic>=1.19.1",
    "coverage>=7.15.4",
    "factory-boy>=3.3.3",
    "fastapi==0.121.2",
    "fastapi-controller>=0.0.8",
    "fastapi-limiter>=0.2.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.4",
    "pymysql>=1.1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-jose>=3.5.0",
    "pytz>=2026.3.post1",
    "redis>=8.1.0",
    "scalar-fastapi>=1.8.2",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: pure unit tests, minimal DB touch, no HTTP",
    "api: single-endpoint contract tests against the FastAPI app",
    "e2e: multi-step journeys chaining several endpoint calls",
]

filterwarnings = [
    "ignore::DeprecationWarning:fastapi_utils.inferring_router",
]


[tool.coverage.run]
omit = ["conftest.py", "helpers.py"]

[tool.ruff]
line-length = 120
