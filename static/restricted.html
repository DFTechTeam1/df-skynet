<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restricted</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  .content { text-align: center; max-width: 40rem; }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 800;
    color: #2c3e50;
  }
  p {
    margin: 0;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: #8a94a6;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1d21; }
    h1 { color: #e8ebee; }
    p { color: #9aa4b2; }
  }
</style>
</head>
<body>
  <div class="content">
    <h1>I'm Watching You</h1>
    <p>This is restricted Area. You're not allowed here!</p>
  </div>
</body>
</html>
