<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Error</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 1.5rem;
    box-sizing: border-box;
  }
  .content { text-align: center; max-width: 40rem; }
  .eyebrow {
    display: inline-block;
    margin: 0 0 1rem;
    padding: 0.3rem 0.85rem;
    border-radius: 999px;
    background: rgba(224, 82, 82, 0.12);
    color: #c0392b;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 0.75rem;
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 800;
    color: #2c3e50;
  }
  p {
    margin: 0;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: #8a94a6;
  }
  .back-link {
    display: inline-block;
    margin-top: 1.5rem;
    font-size: 0.95rem;
    color: #4a90d9;
    text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1d21; }
    .eyebrow { background: rgba(235, 130, 120, 0.16); color: #eb8278; }
    h1 { color: #e8ebee; }
    p { color: #9aa4b2; }
    .back-link { color: #7fb0e8; }
  }
</style>
</head>
<body>
  <div class="content">
    <span class="eyebrow">Error 500</span>
    <h1>Something Went Wrong</h1>
    <p>We hit an unexpected problem on our end. Please try again shortly.</p>
    <a class="back-link" href="/">&larr; Back to home</a>
  </div>
</body>
</html>
